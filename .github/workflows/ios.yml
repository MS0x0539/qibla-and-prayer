# Builds the app on GitHub's Macs (nobody here has one) and runs the tests in the iPhone Simulator.
# - Screenshots of every tab and setup page (English, Dutch, Turkish, Arabic, plus German and French
#   samples) when started by hand with "screenshots" ticked, or with [screenshots] in the commit
#   message. They appear under the run as the "screenshots" artifact.
# - TestFlight upload when started by hand with "testflight" ticked, or with [testflight] in the commit
#   message (main only, after the tests pass). Needs the ASC_* secrets; see docs/PLAN.md.
# Only runs when the app changes: macOS minutes are scarce on a private repository.
name: iOS

on:
  push:
    branches: [main]
    paths: ['App/**', 'Widgets/**', 'Tests/**', 'project.yml', '.github/workflows/ios.yml']
  pull_request:
    paths: ['App/**', 'Widgets/**', 'Tests/**', 'project.yml', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take screenshots
        type: boolean
        default: true
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request replaces the running check; on main runs queue instead, so an upload
# to App Store Connect is never cut off halfway.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      APP: build/Build/Products/Debug-iphonesimulator/QiblaAndPrayer.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and test
        run: |
          set -o pipefail
          # The tail keeps the log short; on failure every error is listed, wherever it was in the log.
          xcodebuild test -project QiblaAndPrayer.xcodeproj -scheme QiblaAndPrayer \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -150 \
            || { echo "::group::All errors"; grep -E ": error:|✘" build.log | sort -u; echo "::endgroup::"; exit 1; }

      - name: Check the app bundle
        run: |
          ls -d "$APP"/*.lproj
          # English is the source language: its text is the keys themselves, so en.lproj has no Localizable.strings.
          for lang in en nl de fr tr ar; do
            test "$lang" = en || test -f "$APP/$lang.lproj/Localizable.strings" || echo "::warning::$lang.lproj/Localizable.strings is missing"
            test -f "$APP/$lang.lproj/InfoPlist.strings" || echo "::warning::$lang.lproj/InfoPlist.strings is missing"
            test -f "$APP/$lang.lproj/AppShortcuts.strings" || echo "::warning::$lang.lproj/AppShortcuts.strings (Siri phrases) is missing"
          done
          test -f "$APP/PrivacyInfo.xcprivacy" || echo "::warning::PrivacyInfo.xcprivacy is missing"
          test -d "$APP/PlugIns/QiblaAndPrayerWidgets.appex" || echo "::error::The widget extension is not embedded"
          grep -q ValidateAppShortcutStringsMetadata build.log || echo "::warning::Xcode did not validate the Siri phrases"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleDisplayName|NSLocation|ITSApp|UISupportedInterfaceOrientations' || true

      - name: Screenshots
        if: inputs.screenshots || contains(github.event.head_commit.message, '[screenshots]')
        run: |
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BID"
          xcrun simctl location "$UDID" set 52.3676,4.9041
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          mkdir -p screenshots
          shot() {  # shot <file name> <app arguments...>
            local name=$1; shift
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          for lang in en nl tr ar; do
            case $lang in en) locale=en_US ;; nl) locale=nl_NL ;; tr) locale=tr_TR ;; ar) locale=ar_SA ;; esac
            for tab in times qibla settings; do
              shot "$lang-$tab" -AppleLanguages "($lang)" -AppleLocale "$locale" -skipOnboarding YES -startTab "$tab" -demoHeading 100
            done
          done
          shot "de-times" -AppleLanguages "(de)" -AppleLocale de_DE -skipOnboarding YES -startTab times
          for tab in tasbih tracker; do
            shot "en-$tab" -AppleLanguages "(en)" -AppleLocale en_US -skipOnboarding YES -startTab "$tab"
          done
          shot "tr-tracker" -AppleLanguages "(tr)" -AppleLocale tr_TR -skipOnboarding YES -startTab tracker
          shot "ar-tasbih" -AppleLanguages "(ar)" -AppleLocale ar_SA -skipOnboarding YES -startTab tasbih
          # The map loads tiles and mosques over the network: give it longer.
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BID" -AppleLanguages "(en)" -AppleLocale en_US -skipOnboarding YES -startTab qibla -showMap YES
          sleep 15
          xcrun simctl io "$UDID" screenshot "screenshots/en-map.png"
          shot "fr-settings" -AppleLanguages "(fr)" -AppleLocale fr_FR -skipOnboarding YES -startTab settings
          for step in 0 1 2 3 4 5 6; do
            shot "setup-$step-en" -AppleLanguages "(en)" -AppleLocale en_US -setupStep "$step"
          done
          shot "setup-3-ar" -AppleLanguages "(ar)" -AppleLocale ar_SA -setupStep 3
          # The language picked inside the app, different from the iPhone's.
          shot "in-app-en-on-dutch-iphone" -AppleLanguages "(nl)" -AppleLocale nl_NL -skipOnboarding YES -appLanguage en
          shot "in-app-ar-on-english-iphone" -AppleLanguages "(en)" -AppleLocale en_US -skipOnboarding YES -appLanguage ar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore

  # Same route as Esports Atlas: the archive is unsigned and Xcode signs it while exporting, with
  # Apple's cloud-managed distribution certificate, authenticated by the App Store Connect API key
  # (Admin role). No certificate or profile lives in the repo or on the runner. Export takes the
  # entitlements (the widgets' App Group) from the archived binaries, so an ad hoc signature adds them first.
  testflight:
    needs: build
    if: github.ref == 'refs/heads/main' && (inputs.testflight || contains(github.event.head_commit.message, '[testflight]'))
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Rises every run, and on a re-run too (12.1, 12.2, 13.1): Apple refuses a reused number.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The App Store Connect key is set
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 to the repository's Actions secrets (see docs/PLAN.md)."
            exit 1
          fi
          # Wrong-looking secrets fail here, in seconds, instead of after the archive. The full check,
          # including a real sign-in, is the "Check App Store Connect key" workflow.
          ok=true
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID should be the 10-character Key ID from AuthKey_XXXXXXXXXX.p8."; ok=false; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::ASC_ISSUER_ID should look like 69a6de7e-0000-0000-0000-000000000000."; ok=false; }
          grep -q -- "-----BEGIN PRIVATE KEY-----" <<<"$ASC_KEY_P8" || { echo "::error::ASC_KEY_P8 should be the whole .p8 file."; ok=false; }
          $ok

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned; signed while exporting)
        run: |
          set -o pipefail
          xcodebuild archive -project QiblaAndPrayer.xcodeproj -scheme QiblaAndPrayer -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tail -80

      - name: Add the entitlements (ad hoc signature, replaced while exporting)
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/QiblaAndPrayer.app"
          codesign --force --sign - --entitlements Widgets/Widgets.entitlements "$APP/PlugIns/QiblaAndPrayerWidgets.appex"
          codesign --force --sign - --entitlements App/QiblaAndPrayer.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/QiblaAndPrayerWidgets.appex"
          codesign -d --entitlements - "$APP"

      # The key is on disk only during this step and is removed however the step ends.
      - name: Sign and upload to App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -rf "$RUNNER_TEMP/asc"' EXIT
          mkdir -p "$RUNNER_TEMP/asc"
          (umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>D46Y9W86N6</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -80
          echo "Build 1.0 ($BUILD_NUMBER) uploaded. App Store Connect processes it next (10-30 minutes), then TestFlight offers it." >> "$GITHUB_STEP_SUMMARY"
