# XcodeGen spec: nobody here has a Mac, so the Xcode project is generated from this file on
# GitHub's macOS runner (`xcodegen generate`) and never committed.
name: QiblaAndPrayer
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.5.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D46Y9W86N6
targets:
  QiblaAndPrayer:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Adhan
    scheme:
      testTargets:
        - QiblaAndPrayerTests
    settings:
      base:
        # Permanent once the first build reaches App Store Connect: confirm before that.
        PRODUCT_BUNDLE_IDENTIFIER: com.ms0x0539.qiblaandprayer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Qibla & Prayer"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to calculate prayer times and the Qibla direction. This app doesn't share it."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
  QiblaAndPrayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: QiblaAndPrayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.ms0x0539.qiblaandprayer.tests
