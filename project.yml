# XcodeGen spec: nobody here has a Mac, so the Xcode project is generated from this file on
# GitHub's macOS runner (`xcodegen generate`) and never committed.
name: QiblaAndPrayer
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.5.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D46Y9W86N6
targets:
  QiblaAndPrayer:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Adhan
      - target: QiblaAndPrayerWidgets
    scheme:
      testTargets:
        - QiblaAndPrayerTests
        - QiblaAndPrayerUITests
    settings:
      base:
        # Registered as an explicit App ID in the developer account; it can't change after the first upload.
        PRODUCT_BUNDLE_IDENTIFIER: org.psbv.qiblaandprayer
        TARGETED_DEVICE_FAMILY: "1"
        # The App Group the widgets read the settings, place and tasbih count from (registered in the portal).
        CODE_SIGN_ENTITLEMENTS: App/QiblaAndPrayer.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        # Background refresh and Siri's alternative names (arrays); merged with the keys below.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Qibla & Prayer"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to calculate prayer times and the Qibla direction. Apart from Apple Maps, which names the place, shows the map and finds mosques nearby, this app shares it with no one."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Picked in Settings: the same star on paper or on green.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Paper AppIcon-Green"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
  # Next prayer and Tasbih widgets, the Live Activities and the controls. Shares the calculation with the app.
  QiblaAndPrayerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - App/AppSettings.swift
      - App/Prayers.swift
      - App/PrayerEngine.swift
      - App/DiyanetCalendar.swift
      - App/DiyanetTimes.swift
      - App/Theme.swift
      - App/IftarActivity.swift
      - App/NextPrayerActivity.swift
      - App/Tasbih.swift
      - App/OpenScreenIntent.swift
      - App/Localizable.xcstrings
    dependencies:
      - package: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.psbv.qiblaandprayer.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Qibla & Prayer"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        SKIP_INSTALL: "YES"
  QiblaAndPrayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: QiblaAndPrayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.psbv.qiblaandprayer.tests
  # Apple's accessibility audit on each screen (UITests/AccessibilityAuditTests.swift).
  QiblaAndPrayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: QiblaAndPrayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.psbv.qiblaandprayer.uitests
        TARGETED_DEVICE_FAMILY: "1"
